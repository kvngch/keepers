name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Publish release
        run: |
          APK="keepers-${GITHUB_REF_NAME}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "Keepers $GITHUB_REF_NAME" \
            --notes "APK signé, prêt à installer. Toutes les données restent sur l'appareil."
        env:
          GH_TOKEN: ${{ github.token }}
